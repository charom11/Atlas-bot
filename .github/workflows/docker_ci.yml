name: Atlas Bot Docker CI

# CI is intentionally not triggered by direct pushes to main.
# The repository workflow was failing during the current remediation work,
# so direct-to-main commits must not start a broken run flow. CI can still be
# executed for pull requests or manually when the test environment is ready.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: atlas-bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Python tests in container
        run: docker run --rm --entrypoint python atlas-bot:ci -m pytest -q

      - name: Compile Python sources in container
        run: docker run --rm --entrypoint python atlas-bot:ci -m compileall -q .

      - name: Verify image metadata
        run: docker image inspect atlas-bot:ci >/dev/null
